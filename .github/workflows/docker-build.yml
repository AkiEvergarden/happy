name: Build and Push Docker Images

on:
  push:
    branches: [ "main", "ci/workflows/docker-build.yml" ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.server'
      - 'Dockerfile.webapp'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

  workflow_dispatch:
    inputs:
      custom_tag:
        description: '自定义镜像标签 (例如: test-build)'
        required: false
        default: 'manual'
        type: string
      target_image:
        description: '选择要构建的镜像'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - happy-standalone
          - happy-server
          - happy-webapp

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # ❌ 删除了这里的 if 判断，因为 job 层级无法读取 matrix
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            image_name: happy-standalone
          - dockerfile: Dockerfile.server
            image_name: happy-server
          - dockerfile: Dockerfile.webapp
            image_name: happy-webapp
            # build_args: |
            #   POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
            #   REVENUE_CAT_STRIPE=${{ secrets.REVENUE_CAT_STRIPE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=${{ github.event.inputs.custom_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # ✅ 将判断逻辑移到了具体的 step 中
      - name: Build and push Docker image
        if: >-
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.target_image == 'all' ||
          matrix.image_name == github.event.inputs.target_image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: ${{ matrix.build_args }}
          # platforms: linux/amd64,linux/arm64
